name: Build Linux calc_cli and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Qt needed now
      - name: Build calc_cli (pure STL)
        run: |
          g++ -std=c++17 -O2 \
            main_console.cpp calculator.cpp tanksnshells.cpp \
            -o calc_cli
          file calc_cli
          ls -l calc_cli

      # Upload as artifact (backup in Actions UI)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli-linux
          path: calc_cli

      # Create a new release every run and mark it latest
      - name: Create Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
          files: calc_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
