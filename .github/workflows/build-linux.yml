name: Build Linux calc_cli and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config qt6-base-dev

      - name: Build calc_cli (QtCore only)
        run: |
          g++ -std=c++17 -O2 \
            main_console.cpp calculator.cpp tanksnshells.cpp \
            -o calc_cli $(pkg-config --cflags --libs Qt6Core)
          file calc_cli
          ls -l calc_cli

      - name: Create/Update 'latest' Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          draft: false
          make_latest: true
          files: calc_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
