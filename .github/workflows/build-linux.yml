name: Build Linux calc_cli and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04   # <<< older baseline for better compat
    steps:
      - uses: actions/checkout@v4

      - name: Build calc_cli (pure STL, portable)
        run: |
          g++ -std=c++17 -O2 \
            -static-libstdc++ -static-libgcc \
            main_console.cpp calculator.cpp tanksnshells.cpp \
            -o calc_cli
          file calc_cli
          ldd ./calc_cli || true
          strip ./calc_cli

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: calc_cli-linux
          path: calc_cli

      - name: Create Release and upload binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          make_latest: true
          draft: false
          prerelease: false
          files: calc_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
